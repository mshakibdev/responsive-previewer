<!DOCTYPE html>
<html lang="bn">

    <head>
        <meta charset="UTF-8" />
        <title>Responsive Previewer</title>
        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <div class="container">
            <h1>Website Previewer</h1>

            <form id="previewForm">
                <input type="url" id="urlInput" placeholder="https://example.com" required />
                <button type="submit">Preview</button>
            </form>

            <div id="bpEditor">
                <div id="bpEditor">
                    <h2>Breakpoints</h2>
                    <label for="sortOrder">Sort Order:</label>
                    <select id="sortOrder">
                        <option value="asc">Small to Large</option>
                        <option value="desc">Large to Small</option>
                    </select>
                    <ul id="bpList"></ul>
                    <button type="button" id="addBp">Add Breakpoint</button>
                    <button type="button" id="resetBp">Reset Breakpoints</button>
                </div>
            </div>

            <div class="preview-grid"></div>
        </div>
        <script src="script.js"></script>
    </body>

</html>
